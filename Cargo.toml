[workspace]
resolver = "2"
members = ["crates/attest", "crates/core", "crates/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OpenSource03/tokenmaxxing-client"

[workspace.dependencies]
# TLSNotary, pinned to an exact revision of our fork (upstream 0fe3c32 + one commit that exposes
# `SessionConfig`, see https://github.com/OpenSource03/tlsn/commits/tokenmaxxing). Bump deliberately;
# the API is alpha.
tlsn = { git = "https://github.com/OpenSource03/tlsn", rev = "a5f03dfa8351380613e6714e5e9449ecd1c0378a", features = ["mozilla-certs"] }
tlsn-formats = { git = "https://github.com/OpenSource03/tlsn", rev = "a5f03dfa8351380613e6714e5e9449ecd1c0378a" }
spansy = { git = "https://github.com/tlsnotary/tlsn-utils", rev = "64722f7" }
rangeset = "0.4"

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
base64 = "0.22"
rand = "0.9"
k256 = { version = "0.13", features = ["ecdsa"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# Notary WebSocket transport. TLS uses the ring provider explicitly (no aws-lc-rs, no global provider).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Faster proofs in dev builds: MPC code is hot.
[profile.dev.package."*"]
opt-level = 3
